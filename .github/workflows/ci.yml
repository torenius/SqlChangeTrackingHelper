name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  solution_path: SqlChangeTrackingHelper.sln

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .Net
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.solution_path }}

      - name: Build
        run: dotnet build ${{ env.solution_path }} --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution ${{ env.solution_path }} --configuration Release --no-build
